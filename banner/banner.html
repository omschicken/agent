<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F4F1EA; --ink:#111111; --olive:#6F7A68; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 260px; background: transparent; overflow: hidden; font-family: 'Montserrat', 'Arial Black', sans-serif; }

  /* Карточка: сначала круг с вороном по центру, затем раскрывается в баннер */
  .card { position: absolute; left: 24px; top: 20px; width: 1032px; height: 220px; border-radius: 34px; overflow: hidden;
          background: var(--cream); box-shadow: 0 14px 34px rgba(0,0,0,.38), inset 0 0 0 2px rgba(111,122,104,.55);
          animation: appear .55s cubic-bezier(.2,1.3,.3,1) .8s both, morph 1.05s cubic-bezier(.75,0,.2,1) 1.9s both; }
  @keyframes appear { 0% { transform: scale(.55); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes morph {
    0%   { left: 450px; top: 40px; width: 180px; height: 180px; border-radius: 90px }
    100% { left: 24px;  top: 20px; width: 1032px; height: 220px; border-radius: 34px }
  }

  .crowwrap { position: absolute; left: 27px; top: 28px; width: 126px; height: 125px;
              animation: crowmove 1.05s cubic-bezier(.75,0,.2,1) 1.9s both; }
  @keyframes crowmove { 0% { left: 27px; top: 28px; width: 126px; height: 125px } 100% { left: 30px; top: 32px; width: 160px; height: 158px } }
  .crowin { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 4.4s ease-in-out infinite; }
  .crowin img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* серебристый блик по перьям: белая копия силуэта, видна только полоса, которая пробегает слева направо */
  .crowin img.sheen { filter: invert(1); opacity: .5;
    -webkit-mask-image: linear-gradient(100deg, transparent 0%, #000 50%, transparent 100%); mask-image: linear-gradient(100deg, transparent 0%, #000 50%, transparent 100%);
    -webkit-mask-size: 40% 100%; mask-size: 40% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: -80% 0; mask-position: -80% 0; animation: sheen 6s ease-in-out infinite; }
  @keyframes sheen {
    0%, 38% { -webkit-mask-position: -80% 0; mask-position: -80% 0 }
    72%, 100% { -webkit-mask-position: 180% 0; mask-position: 180% 0 }
  }

  .rv { opacity: 0; animation: reveal .65s cubic-bezier(.2,.9,.3,1) both; }
  .name { position: absolute; left: 214px; top: 32px; font-weight: 900; font-size: 60px; letter-spacing: -1.5px; color: var(--ink); line-height: 1; animation-delay: 2.45s; }
  .name i { font-style: normal; color: var(--olive); }
  .tag { position: absolute; left: 216px; top: 106px; font-weight: 800; font-size: 28px; color: var(--olive); letter-spacing: .2px; animation-delay: 2.6s; }
  .age { position: absolute; left: 216px; top: 162px; font-weight: 600; font-size: 20px; color: var(--olive); animation-delay: 2.75s; }
  .label { position: absolute; left: 592px; top: 22px; font-weight: 800; font-size: 20px; letter-spacing: 4px; color: var(--olive); animation-delay: 2.55s; }
  .promowrap { position: absolute; left: 585px; top: 50px; animation-delay: 2.65s; }
  .promo { height: 72px; padding: 0 22px; display: flex; align-items: center; gap: 16px;
           border: 3.5px dashed var(--ink); border-radius: 22px; animation: pulse 2s ease-in-out 3.4s infinite; transform-origin: 30% 50%; }
  .promo b { font-weight: 900; font-size: 52px; letter-spacing: 1px; color: var(--ink); }
  .promo em { font-style: normal; font-weight: 900; font-size: 32px; color: var(--cream); background: var(--ink); padding: 6px 14px; border-radius: 14px;
              animation: pop 2s ease-in-out 3.55s infinite; display: inline-block; }
  .btn { position: absolute; left: 585px; top: 138px; width: 420px; height: 62px; border-radius: 31px; background: var(--ink); color: var(--cream);
         display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 800; font-size: 28px; overflow: hidden; animation-delay: 2.8s; }
  .btn span.arrow { display: inline-block; animation: arrow 1.4s ease-in-out infinite; font-weight: 800; }
  .btn::after { content: ""; position: absolute; top: -10px; left: -60%; width: 40%; height: 90px; transform: skewX(-22deg);
                background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); animation: shine 3s ease-in-out 3.4s infinite; }

  @keyframes reveal { 0% { opacity: 0; transform: translateX(-26px) } 100% { opacity: 1; transform: none } }
  .promowrap.rv, .btn.rv, .label.rv { animation-name: revealr; }
  @keyframes revealr { 0% { opacity: 0; transform: translateX(26px) } 100% { opacity: 1; transform: none } }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1) } 50% { transform: translateY(-3px) scale(1.018) } }
  @keyframes glare { 0%,80%,100% { transform: scale(1); filter: none } 90% { transform: scale(1.18); filter: brightness(1.2) } }
  @keyframes shine { 0%,50% { left: -60% } 85%,100% { left: 130% } }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
  @keyframes pop { 0%,100% { transform: scale(1) rotate(0) } 50% { transform: scale(1.14) rotate(-3deg) } }
  @keyframes arrow { 0%,100% { transform: translateX(0) } 50% { transform: translateX(7px) } }
</style>
</head>
<body>
<div class="card">
  <div class="crowwrap"><div class="crowin"><img src="crow.png" alt=""><img class="sheen" src="crow.png" alt=""></div></div>
  <div class="name rv">case<i>crow</i></div>
  <div class="tag rv">кейсы для CS2</div>
  <div class="age rv">18+ · играйте ответственно</div>
  <div class="label rv">ПРОМОКОД</div>
  <div class="promowrap rv"><div class="promo"><b>SHORTS</b><em>+5%</em></div></div>
  <div class="btn rv">Открыть кейсы <span class="arrow">→</span></div>
</div>
<script>
  window.setT = function (ms) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; });
  };
</script>
</body>
</html>
