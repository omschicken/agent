<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 312px; background: transparent; overflow: hidden; }
  :root { --cream: #F4EFE8; --s: 0.5268; }

  .shell { position: absolute; left: 24px; top: 16px; width: 1032px; height: 275px; filter: drop-shadow(0 12px 20px rgba(0,0,0,.42));
           animation: appear .55s cubic-bezier(.2,1.3,.3,1) .8s both; }
  .card { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; animation: expand 1s cubic-bezier(.75,0,.2,1) 1.9s both; }
  @keyframes appear { 0% { transform: scale(.55); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes expand {
    0%   { clip-path: inset(47px 426px 48px 426px round 90px) }
    100% { clip-path: inset(0 0 0 0 round 20px) }
  }

  /* медленный наезд камеры на всю картинку и все эффекты вместе */
  .cam { position: absolute; inset: 0; transform-origin: 66% 64%; animation: cam 18s ease-in-out 2.9s both; }
  @keyframes cam { 0% { transform: scale(1) } 100% { transform: scale(1.045) } }

  /* рабочее поле 1959x521 */
  .design { position: absolute; left: 0; top: 0; width: 1959px; height: 521px; transform: scale(var(--s)); transform-origin: 0 0; }
  .design > img { position: absolute; left: 0; top: 0; width: 1959px; height: 521px; display: block; }

  /* блик по кнопке: полоса, ограниченная формой кнопки */
  .btnfx { position: absolute; left: 1462px; top: 366px; width: 468px; height: 106px; border-radius: 53px; overflow: hidden; }
  .btnfx i { position: absolute; top: -40px; left: -200px; width: 120px; height: 190px; transform: skewX(-22deg);
             background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0)); animation: shine 3.4s ease-in-out 3.8s infinite; }
  @keyframes shine { 0%,45% { left: -200px } 80%,100% { left: 620px } }

  /* плашка с промокодом: копия этого места картинки, чуть пульсирует поверх оригинала */
  .promoClone { position: absolute; left: 1425px; top: 28px; width: 515px; height: 160px; border-radius: 32px;
                background: url(card_ref.png) -1425px -28px / 1959px 521px no-repeat; animation: pulse 2.4s ease-in-out 3.9s infinite; transform-origin: 50% 50%; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.032) } }

  /* мерцание ворона на крышке кейса */
  .star { position: absolute; left: 1186px; top: 318px; width: 90px; height: 90px; margin: -45px 0 0 -45px; opacity: 0; animation: twinkle 3.8s ease-in-out 4s infinite; }
  .star::before, .star::after { content: ""; position: absolute; left: 50%; top: 50%; background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
  .star::before { width: 90px; height: 3px; margin: -1.5px 0 0 -45px; }
  .star::after { width: 3px; height: 90px; margin: -45px 0 0 -1.5px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
  @keyframes twinkle { 0%,60%,100% { opacity: 0; transform: scale(.3) rotate(0) } 72% { opacity: 1; transform: scale(1) rotate(20deg) } 86% { opacity: 0; transform: scale(.5) rotate(45deg) } }

  /* общий скользящий свет и пылинки в луче */
  .gloss { position: absolute; top: -90px; left: -500px; width: 380px; height: 760px; transform: rotate(18deg); mix-blend-mode: soft-light;
           background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.7), rgba(255,255,255,0)); animation: gloss 8s ease-in-out 4.6s infinite; }
  @keyframes gloss { 0%,30% { transform: translateX(0) rotate(18deg) } 80%,100% { transform: translateX(2900px) rotate(18deg) } }
  .mote { position: absolute; border-radius: 50%; background: rgba(255,250,235,.9); filter: blur(.6px); opacity: 0; animation: mote var(--dur) linear var(--delay) infinite; }
  @keyframes mote { 0% { transform: translate(0,0) scale(.6); opacity: 0 } 15% { opacity: .75 } 85% { opacity: .75 } 100% { transform: translate(var(--dx), -620px) scale(1.1); opacity: 0 } }

  /* вступление: круг с вороном по центру, затем ворон уезжает на своё место, крем растворяется */
  .intro { position: absolute; inset: 0; background: var(--cream); animation: fillOut .55s ease-in 2.75s both; }
  .introCrow { position: absolute; left: 6.3px; top: 26.3px; width: 158px; height: 181.7px;
               animation: crowFly .9s cubic-bezier(.75,0,.2,1) 1.9s both, crowOut .3s ease-out 2.8s both; transform-origin: 50% 50%; }
  @keyframes crowFly { 0% { transform: translate(430.7px, 20.1px) scale(.72) } 100% { transform: translate(0,0) scale(1) } }
  @keyframes crowOut { 0% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes fillOut { 0% { opacity: 1 } 100% { opacity: 0 } }
</style>
</head>
<body>
<div class="shell"><div class="card">
  <div class="cam"><div class="design">
    <img src="card_ref.png" alt="">
    <div class="btnfx"><i></i></div>
    <div class="promoClone"></div>
    <div class="star"></div>
    <div class="gloss"></div>
    <div id="motes"></div>
  </div></div>
  <div class="intro"><img class="introCrow" src="crow_ref.png" alt=""></div>
</div></div>
<script>
  (function () {
    var seed = 11;
    function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    var host = document.getElementById('motes');
    for (var i = 0; i < 26; i++) {
      var d = document.createElement('div'); d.className = 'mote';
      var sz = 3 + rnd() * 5, dur = 9 + rnd() * 8;
      d.style.cssText = 'left:' + (900 + rnd() * 1000) + 'px;top:' + (500 + rnd() * 30) + 'px;width:' + sz + 'px;height:' + sz + 'px;--dur:' + dur + 's;--delay:-' + (rnd() * dur) + 's;--dx:' + (-80 + rnd() * 160) + 'px';
      host.appendChild(d);
    }
  })();
  window.setT = function (ms) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; });
  };
</script>
</body>
</html>
